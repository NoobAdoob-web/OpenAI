<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fake WhatsApp Web (test only)</title></head>
<body>
<p>Fake WhatsApp Web for automated tests. All people and messages are made up.</p>
<script>
// Mimics the parts of WhatsApp Web's internals the adapter reads, in the shape
// the adapter expects. It proves the extension's plumbing, not that real
// WhatsApp Web has this shape: only a test on a real account proves that.
(() => {
  const wid = (s) => ({ _serialized: s, server: s.split('@')[1], user: s.split('@')[0], toString: () => s });
  const coll = (models) => ({
    getModelsArray: () => models,
    get: (id) => models.find((m) => (m.id && (m.id._serialized || m.id)) === (id._serialized || id)),
  });
  const P = (n) => `91980000000${n}@c.us`;
  const G = '120363000000000001@g.us';
  const DM = P(2);
  const now = Math.floor(Date.now() / 1000);

  const contacts = [
    [1, 'Aman'], [2, 'Gaurav'], [3, 'Hansika'], [4, 'Priya'], [5, 'Rahul'], [6, 'Rahul'], [9, 'Vikram'],
  ].map(([n, name]) => ({ id: wid(P(n)), name, formattedName: name }));

  const participants = [1, 2, 3, 4, 5, 6].map((n) => ({ id: wid(P(n)), isAdmin: n === 1, isSuperAdmin: false }));
  const groupMetadata = { id: wid(G), subject: 'Sunday Cricket Club', size: 6, participants: coll(participants) };

  const key = (fromMe, remote, id, participant) => ({
    _serialized: `${fromMe}_${remote}_${id}` + (participant ? `_${participant}` : ''),
    fromMe, remote: wid(remote), id, participant: participant ? wid(participant) : undefined,
  });
  const pollKey = key(false, G, '3EB0POLL1', P(2));
  const msgs = [
    { id: key(false, G, 'A1', P(3)), type: 'chat', body: 'Anyone know a good electrician near the club?', t: now - 86400 * 40, author: wid(P(3)) },
    { id: key(false, G, 'A2', P(5)), type: 'chat', body: 'I do AC repair, call me', t: now - 86400 * 20, author: wid(P(5)) },
    { id: key(false, G, 'A3', P(4)), type: 'image', body: '/9j/4AAQSkZJRgABAQAAAQABAAD', caption: 'Ground photo', t: now - 86400 * 10, author: wid(P(4)) },
    { id: key(false, G, 'A4', P(6)), type: 'revoked', t: now - 86400 * 5, author: wid(P(6)) },
    { id: pollKey, type: 'poll_creation', pollName: 'Coming on Sunday?', pollOptions: [{ name: 'Yes', localId: 0 }, { name: 'No', localId: 1 }], pollSelectableOptionsCount: 1, t: now - 86400 * 2, author: wid(P(2)) },
    { id: key(true, DM, 'B1'), type: 'chat', body: 'See you at 7', t: now - 3600, from: wid(P(1)) },
  ];
  const groupChat = { id: wid(G), formattedTitle: 'Sunday Cricket Club', groupMetadata, msgs: coll(msgs.slice(0, 5)), archive: false };
  const dmChat = { id: wid(DM), formattedTitle: 'Gaurav', msgs: coll(msgs.slice(5)), archive: false };

  const voteRec = (n, opt, ts) => ({ parentMsgKey: pollKey, sender: wid(P(n)), selectedOptionLocalIds: [opt], senderTimestampMs: ts });
  const votes = [voteRec(1, 0, 1), voteRec(2, 0, 2), voteRec(3, 1, 3), voteRec(5, 0, 4), voteRec(9, 1, 5), voteRec(4, 0, 6), { ...voteRec(4, 0, 7), selectedOptionLocalIds: [] }];

  const modules = {
    WAWebCollections: {
      Chat: { ...coll([groupChat, dmChat]), getActive: () => groupChat },
      Msg: coll(msgs),
      Contact: coll(contacts),
      GroupMetadata: coll([groupMetadata]),
      PollVote: coll(votes),
    },
    WAWebUserPrefsMeUser: { getMaybeMeUser: () => wid(P(1)) },
    __debug: { modulesMap: { WAWebCollections: {}, WAWebUserPrefsMeUser: {}, WAWebPollsVotesSchema: {}, WAWebPollsSendVoteJob: {} } },
  };
  window.Debug = { VERSION: '2.3000.0-fake' };
  window.__d = function () {};
  window.require = (name) => {
    if (name in modules) return modules[name];
    throw new Error(`Requiring unknown module "${name}"`);
  };

  // The on-computer database: more history than memory, plus poll votes.
  const open = indexedDB.open('model-storage', 1);
  open.onupgradeneeded = () => {
    const db = open.result;
    const m = db.createObjectStore('message', { keyPath: 'id' });
    for (let i = 0; i < 250; i++) {
      m.put({ id: `false_${G}_OLD${i}_${P(2 + (i % 4))}`, type: 'chat', body: `old message ${i}`, t: now - 86400 * (400 - i) });
    }
    for (const x of msgs) if (x.type === 'chat') m.put({ id: x.id._serialized, type: 'chat', body: x.body, t: x.t });
    const v = db.createObjectStore('poll-votes', { autoIncrement: true });
    for (const r of votes) v.put({ parentMsgKey: pollKey._serialized, sender: r.sender._serialized, selectedOptionLocalIds: r.selectedOptionLocalIds, senderTimestampMs: r.senderTimestampMs });
  };
  open.onsuccess = () => { open.result.close(); window.__fakeReady = true; };
})();
</script>
</body>
</html>
