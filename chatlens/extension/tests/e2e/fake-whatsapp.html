<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fake WhatsApp Web (test only)</title></head>
<body>
<p>Fake WhatsApp Web for automated tests. All people and messages are made up.</p>
<script>
// Mimics the parts of WhatsApp Web the poll check reads, following the data
// shapes documented by the open-source WA-JS project. It proves the
// extension's logic and plumbing. Only a real account proves the real thing.
//
// ?variant=modern   (default) no "WAWebCollections" module, privacy IDs (@lid),
//                   WhatsApp's own getVotes function, message keys without _serialized
// ?variant=legacy   "WAWebCollections" module, phone IDs, votes in the database only
// ?variant=mixed    members by phone ID, votes by privacy ID, mapped by WhatsApp's lookup
// ?variant=dm       a one-to-one chat is open instead of a group
// ?variant=unreadable  votes exist but their chosen option can't be read: must show an error
(() => {
  const variant = new URLSearchParams(location.search).get('variant') || 'modern';
  const modern = variant !== 'legacy';

  const wid = (s) => {
    const o = { server: s.split('@')[1], user: s.split('@')[0], toString: () => s };
    if (!modern) o._serialized = s;
    return o;
  };
  const coll = (models) => ({
    getModelsArray: () => models,
    get: (id) => models.find((m) => String(m.id) === String(id)),
    findFirst: (fn) => models.find(fn),
  });
  const P = (n) => `91980000000${n}@c.us`;
  const L = (n) => `7700000${n}@lid`;
  const G = '120363000000000001@g.us';
  const memberId = variant === 'modern' || variant === 'unreadable' ? L : P; // how the group lists people
  const voterId = variant === 'legacy' ? P : L; // how votes name people
  const now = Math.floor(Date.now() / 1000);

  const names = { 1: 'Aman', 2: 'Gaurav', 3: 'Hansika', 4: 'Priya', 5: 'Rahul', 9: 'Vikram' };
  const contactOf = (n) => (n === 6 ? { id: wid(memberId(6)), pushname: 'Rahul' } : { id: wid(memberId(n)), name: names[n], formattedName: names[n] });
  const participants = [1, 2, 3, 4, 5, 6].map((n) => ({
    id: wid(memberId(n)),
    isAdmin: n === 1,
    isSuperAdmin: false,
    // Legacy WhatsApp: names come from the contact list, not the participant.
    ...(variant === 'legacy' ? {} : { contact: contactOf(n) }),
  }));
  if (modern) participants.push({ id: wid(memberId(8)), isAdmin: false, stale: true, contact: { id: wid(memberId(8)), name: 'Old Entry' } });
  const pastParticipants = [{ id: wid(memberId(9)), isAdmin: false, ...(variant === 'legacy' ? {} : { contact: contactOf(9) }) }];
  const groupMetadata = { id: wid(G), subject: 'Sunday Cricket Club', size: 6, participants: coll(participants), pastParticipants: coll(pastParticipants) };

  const key = (fromMe, remote, id, participant) => {
    const s = `${fromMe}_${remote}_${id}` + (participant ? `_${participant}` : '');
    const k = { fromMe, remote: wid(remote), id, participant: participant ? wid(participant) : undefined, toString: () => s };
    if (!modern) k._serialized = s;
    return k;
  };
  const pollKey = key(false, G, '3EB0POLL1', memberId(2));
  const oldPollKey = key(false, G, '3EB0POLL0', memberId(3));
  const groupMsgs = [
    { id: key(false, G, 'A1', memberId(3)), type: 'chat', body: 'Who is coming?', t: now - 86400 * 4, author: wid(memberId(3)) },
    { id: oldPollKey, type: 'poll_creation', pollName: 'Old poll', pollOptions: [{ name: 'A', localId: 0 }, { name: 'B', localId: 1 }], pollSelectableOptionsCount: 1, t: now - 86400 * 9, author: wid(memberId(3)) },
    { id: pollKey, type: 'poll_creation', pollName: 'Coming on Sunday?', pollOptions: [{ name: 'Yes', localId: 0 }, { name: 'No', localId: 1 }], pollSelectableOptionsCount: 1, t: now - 86400 * 2, author: wid(memberId(2)) },
  ];
  groupMsgs.push({ id: key(false, G, 'V1', memberId(5)), type: 'poll_update', pollUpdateParentKey: pollKey, pollOptions: [], t: now - 86400, author: wid(memberId(5)) });
  groupMsgs.push({ id: key(false, G, 'V2', memberId(2)), type: 'poll_creation', pollUpdateParentKey: pollKey, pollOptions: [{ name: 'Yes', localId: 0 }], t: now - 3600, author: wid(memberId(2)) });
  const groupChat = { id: wid(G), formattedTitle: 'Sunday Cricket Club', groupMetadata, msgs: coll(groupMsgs), active: variant !== 'dm', isGroup: true };
  const dmChat = { id: wid(P(2)), formattedTitle: 'Gaurav', msgs: coll([]), active: variant === 'dm', isGroup: false };
  const chats = coll([dmChat, groupChat]);

  // Aman (me) Yes, Gaurav Yes, Hansika No, Rahul(5) Yes, Vikram (left) No,
  // Priya voted then removed her vote. Rahul(6) never voted.
  const voteRows = [[1, 0, 1], [2, 0, 2], [3, 1, 3], [5, 0, 4], [9, 1, 5], [4, 0, 6]].map(([n, opt, ts]) => ({
    parentMsgKey: pollKey, sender: wid(voterId(n)), selectedOptionLocalIds: [opt], senderTimestampMs: ts,
  }));
  voteRows.push({ parentMsgKey: pollKey, sender: wid(voterId(4)), selectedOptionLocalIds: [], senderTimestampMs: 7 });

  window.__opened = [];
  const factories = {
    WAWebUserPrefsMeUser: () => ({ getMaybeMeUser: () => wid(P(1)), getMaybeMeLidUser: () => wid(L(1)) }),
    WAWebChatCollection: () => ({ ChatCollection: chats }),
    WAWebPollsVoteCollection: () => ({
      upsertVotesDb: () => null,
      getVotes: async (keys) => voteRows.filter((r) => keys.some((k) => String(k) === String(r.parentMsgKey))),
    }),
    WAWebPollsVoteDbUtils: () => ({
      voteFromDbRow: (row) => ({ ...row, sender: wid(row.sender), selectedOptionLocalIds: JSON.parse(row.optionsPacked) }),
    }),
    WAWebApiContact: () => ({
      getPhoneNumber: () => null,
      getPnForLid: (w) => {
        const n = String(w).match(/^7700000(\d)@lid$/);
        return n ? wid(P(n[1])) : null;
      },
    }),
    WAWebCollections: () => ({
      Chat: chats,
      Contact: coll([1, 2, 3, 4, 5, 6, 9].map((n) => contactOf(n)).map((c) => ({ ...c, isMe: false }))),
    }),
    'WAWebMoment-es': () => {
      window.__momentOpened = true; // must never happen
      return { locale: 'es' };
    },
    WAWebSomeOtherModule: () => ({ hello: 1 }),
  };
  const available = {
    modern: ['WAWebUserPrefsMeUser', 'WAWebChatCollection', 'WAWebPollsVoteCollection', 'WAWebPollsVoteDbUtils', 'WAWebMoment-es', 'WAWebSomeOtherModule'],
    unreadable: ['WAWebUserPrefsMeUser', 'WAWebChatCollection', 'WAWebSomeOtherModule'],
    dm: ['WAWebUserPrefsMeUser', 'WAWebChatCollection', 'WAWebPollsVoteCollection', 'WAWebSomeOtherModule'],
    legacy: ['WAWebUserPrefsMeUser', 'WAWebCollections', 'WAWebMoment-es', 'WAWebSomeOtherModule'],
    mixed: ['WAWebUserPrefsMeUser', 'WAWebChatCollection', 'WAWebPollsVoteCollection', 'WAWebApiContact', 'WAWebSomeOtherModule'],
  }[variant];
  const built = {};
  const load = (id) => {
    if (id === '__debug') return { modulesMap: Object.fromEntries(available.map((a) => [a, { factory() {} }])) };
    if (!available.includes(id)) throw new Error(`Requiring unknown module "${id}"`);
    if (!(id in built)) {
      window.__opened.push(id);
      built[id] = factories[id]();
    }
    return built[id];
  };
  window.Debug = { VERSION: `2.3000.0-fake-${variant}` };
  window.__d = function () {};
  window.ErrorGuard = { skipGuardGlobal() {} };
  window.importNamespace = (id) => load(id);
  window.require = (id) => load(id);

  // WhatsApp's database on this computer: the "poll-votes" table.
  const open = indexedDB.open('model-storage', 1);
  open.onupgradeneeded = () => {
    const v = open.result.createObjectStore('poll-votes', { autoIncrement: true });
    for (const r of voteRows) {
      const row = { parentMsgKey: String(r.parentMsgKey), sender: String(r.sender), senderTimestampMs: r.senderTimestampMs };
      if (modern) row.optionsPacked = JSON.stringify(r.selectedOptionLocalIds);
      else row.selectedOptionLocalIds = r.selectedOptionLocalIds;
      v.put(row);
    }
  };
  open.onsuccess = () => { open.result.close(); window.__fakeReady = true; };
})();
</script>
</body>
</html>
