name: Daily stock check

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 7:00 AM India time (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      limit:
        description: "Only check the first N products (0 = all)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check stock and email the report
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python run.py check --limit "${{ github.event.inputs.limit || 0 }}"
      - name: Keep screenshots and results for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-check-${{ github.run_number }}
          path: |
            results/latest.csv
            debug/
          retention-days: 14
      - name: Save today's results to the repository
        if: success()
        run: |
          git config user.name "stock-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/latest.csv results/history.csv
          git commit -m "Stock check results $(date -u +%F)" || exit 0
          git pull --rebase --autostash && git push
