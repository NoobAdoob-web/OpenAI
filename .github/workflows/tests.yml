name: Tests

on:
  push:
    paths-ignore: ["results/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python -m pytest tests -q
